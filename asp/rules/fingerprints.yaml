# Web 指纹识别规则库
#
# 字段说明：
#   name           组件名（同名规则的多条命中会【累加置信度】）
#   category       cms / framework / middleware / language / javascript / cache / other
#   confidence     本条规则的权重（0~1）。多条累加后达到 0.5 才会被输出
#   headers        响应头正则
#   body           正文正则
#   cookies        Cookie 名正则（Cookie 名常直接暴露技术栈）
#   version_regex  版本提取正则（第一个捕获组作为版本号）
#
# ── 编写技巧：为什么同一个组件要拆成多条规则 ──
#
# 单条规则内部的多个 pattern 是「任一命中即算命中」，只加一次置信度。
# 想要表达「必须同时具备多个特征」这种更强判断，应该拆成多条同名规则 ——
# 命中一条只加到 0.4（低于阈值，不输出），命中两条累加到 0.8（输出）。
#
# 这样设计的好处是：置信度能真实反映「有几个独立特征支持这个结论」，
# 而不是把所有特征压成一个布尔值。
#
# ⚠️ 正则建议用 YAML 单引号包裹：单引号内反斜杠是字面量，不需要双写转义。

# ══════════════════════════ 中间件 / Web 服务器 ══════════════════════════

- name: Nginx
  category: middleware
  confidence: 0.9
  headers:
    - 'Server:\s*nginx'
  version_regex: 'Server:\s*nginx/([\d.\w]+)'

- name: Apache httpd
  category: middleware
  confidence: 0.9
  headers:
    - 'Server:\s*Apache(?:/[\d.]+)?'
  version_regex: 'Server:\s*Apache/([\d.\w]+)'

- name: Microsoft IIS
  category: middleware
  confidence: 0.9
  headers:
    - 'Server:\s*Microsoft-IIS'
  version_regex: 'Microsoft-IIS/([\d.]+)'

- name: Apache Tomcat
  category: middleware
  confidence: 0.7
  body:
    - 'Apache Tomcat/([\d.]+)'
    - '<title>Apache Tomcat'
  version_regex: 'Apache Tomcat/([\d.]+)'

- name: OpenResty
  category: middleware
  confidence: 0.85
  headers:
    - 'Server:\s*openresty'

- name: Caddy
  category: middleware
  confidence: 0.85
  headers:
    - 'Server:\s*Caddy'

- name: Jetty
  category: middleware
  confidence: 0.7
  headers:
    - 'Server:\s*Jetty'
  body:
    - 'Powered by Jetty'

- name: gunicorn
  category: middleware
  confidence: 0.8
  headers:
    - 'Server:\s*gunicorn'

- name: uvicorn
  category: middleware
  confidence: 0.8
  headers:
    - 'Server:\s*uvicorn'

