name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前，先看一眼 [README 的路线图](../blob/main/README.md#路线图) ——
        可能已经在计划里了。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的实际问题
      description: |
        **请描述问题，而不是直接描述解决方案。**

        「我想支持 UDP 扫描」不如
        「我需要评估一台只开了 UDP 服务的主机，现在扫不到任何结果」
        有用 —— 后者能让我判断有没有更合适的做法。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 包括你「现在是怎么绕过去的」
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及哪部分
      multiple: true
      options:
        - 资产发现（子域名 / DNS）
        - 端口扫描与服务识别
        - Web 指纹识别
        - PoC 引擎
        - 报告导出
        - Web 看板 / REST 接口
        - LLM 告警降噪
        - 部署 / 工程化
        - 文档
        - 其他
    validations:
      required: true
