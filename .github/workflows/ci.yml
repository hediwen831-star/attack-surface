name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 以可编辑模式安装【包本身】+ dev 依赖。
          #
          # ⚠️ 这里曾经漏掉「安装包本身」，只装了 requirements-dev.txt，
          # 导致 CI 里报 `ModuleNotFoundError: No module named 'asp'`。
          # 而本地一直没暴露这个问题 —— 因为我在本地跑测试时设了 PYTHONPATH。
          #
          # 教训：**本地用 PYTHONPATH 绕过安装问题，会掩盖「包没装好」这个真实缺陷。**
          # 使用者 clone 下来直接执行 `python -m asp.cli` 同样会失败。
          # CI 必须走和使用者完全一样的安装路径，否则它验证的不是真实场景。
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check asp tests

      - name: Run tests
        run: pytest -v

      - name: Smoke test CLI
        run: |
          python -m asp.cli --version
          python -m asp.cli poc list
          python -m asp.cli --help

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify PoC files are packaged
        run: |
          python -c "
          import zipfile, glob, sys
          whl = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(whl).namelist()
          pocs = [n for n in names if '/pocs/' in n and n.endswith('.yaml')]
          print(f'{whl}: {len(pocs)} PoC files')
          for p in pocs: print(' ', p)
          sys.exit(0 if pocs else 1)
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
