name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 以可编辑模式安装【包本身】+ dev 依赖。
          #
          # ⚠️ 这里曾经漏掉「安装包本身」，只装了 requirements-dev.txt，
          # 导致 CI 里报 `ModuleNotFoundError: No module named 'asp'`。
          # 而本地一直没暴露这个问题 —— 因为我在本地跑测试时设了 PYTHONPATH。
          #
          # 教训：**本地用 PYTHONPATH 绕过安装问题，会掩盖「包没装好」这个真实缺陷。**
          # 使用者 clone 下来直接执行 `python -m asp.cli` 同样会失败。
          # CI 必须走和使用者完全一样的安装路径，否则它验证的不是真实场景。
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check asp tests

      - name: Run tests
        run: pytest -v

      - name: Smoke test CLI
        run: |
          python -m asp.cli --version
          python -m asp.cli poc list
          python -m asp.cli --help

      - name: Smoke test JSON contract
        run: |
          # `--json` 必须真的往 stdout 输出可解析的 JSON，且带可达性字段。
          #
          # 这一条是回归守卫：`cmd_poc_run` 曾经漏掉 `print(text)`，
          # 导致 `--json` 不加 `-o` 时输出空白 —— 而单元测试没覆盖到入口层，
          # 这个 bug 一直活到补上 cli.py 覆盖率。
          # 单元测试现在守住了，这里再从"使用者实际怎么调用"的角度验一遍。
          python - <<'PY'
          import json, subprocess, sys

          # 指向一个必定连不上的端口，走「目标不可达」分支
          proc = subprocess.run(
              [sys.executable, "-m", "asp.cli", "poc", "run",
               "http://127.0.0.1:1", "--json"],
              capture_output=True, text=True, timeout=120,
          )
          out = proc.stdout
          assert out.lstrip().startswith("{"), (
              f"--json 必须输出 JSON，实际 stdout 前 200 字符: {out[:200]!r}"
          )
          data = json.loads(out)
          assert "target_reachable" in data, "JSON 必须带可达性字段"
          assert "errors" in data, "JSON 必须带 errors 字段"
          assert data["target_reachable"] is False, "连不上的目标必须判为不可达"
          assert data["errors"], "不可达必须留下 errors"
          # 退出码 2 = 目标不可达。绝不能是 0（那会被流水线当成"扫过了很干净"）
          assert proc.returncode == 2, (
              f"目标不可达时退出码必须是 2，实际 {proc.returncode}"
          )
          print("JSON contract OK:", json.dumps(
              {k: data[k] for k in ("target_reachable", "responses_ok")},
              ensure_ascii=False))
          PY

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify PoC files are packaged
        run: |
          python -c "
          import zipfile, glob, sys
          whl = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(whl).namelist()
          pocs = [n for n in names if '/pocs/' in n and n.endswith('.yaml')]
          print(f'{whl}: {len(pocs)} PoC files')
          for p in pocs: print(' ', p)
          sys.exit(0 if pocs else 1)
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
