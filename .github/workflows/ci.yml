name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check asp tests

      - name: Run tests
        run: pytest -v

      - name: Smoke test CLI
        run: |
          python -m asp.cli --version
          python -m asp.cli poc list
          python -m asp.cli --help

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify PoC files are packaged
        run: |
          python -c "
          import zipfile, glob, sys
          whl = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(whl).namelist()
          pocs = [n for n in names if '/pocs/' in n and n.endswith('.yaml')]
          print(f'{whl}: {len(pocs)} PoC files')
          for p in pocs: print(' ', p)
          sys.exit(0 if pocs else 1)
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
