[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asp"
version = "0.1.0"
description = "ASP — 外网攻击面自动化测绘与漏洞验证平台"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "hediwen" }]
keywords = ["security", "asm", "easm", "recon", "subdomain", "vulnerability-scanner"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "httpx>=0.27,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
asp = "asp.cli:main"

[project.urls]
Homepage = "https://github.com/yourname/attack-surface-platform"
Issues = "https://github.com/yourname/attack-surface-platform/issues"

[tool.setuptools]
packages = ["asp", "asp.core", "asp.discover", "asp.plugins", "asp.services"]

[tool.setuptools.package-data]
asp = ["pocs/*.yaml"]

# ---------------------------------------------------------------- 工具配置

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",   # 行长由 formatter 兜底，注释里的长说明不该被打断
  "B008",   # 允许函数默认值里调用函数（dataclass field 需要）
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]   # 测试里允许 assert False 之类的写法

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
