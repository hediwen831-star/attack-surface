[build-system]
# setuptools>=77 是 PEP 639（SPDX license 表达式）的下限，
# 下面 [project] 里的 license 用的是新写法。
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asp"
version = "0.1.1"
description = "ASP — 外网攻击面自动化测绘与漏洞验证平台"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "hediwen" }]
keywords = ["security", "asm", "easm", "recon", "subdomain", "vulnerability-scanner"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "httpx>=0.27,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
# Web API 与可视化看板 —— 刻意做成可选依赖。
#
# 核心能力（子域名 / 端口 / 指纹 / PoC 引擎）只需要 3 个运行时依赖；
# 不该因为「想看个界面」就被迫装上 FastAPI + uvicorn 这一整套。
# 装法：pip install -e ".[api]"，然后 asp serve
api = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
]

dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mmh3>=4.0",
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "httpx>=0.27,<1.0",
]

[project.scripts]
asp = "asp.cli:main"

[project.urls]
Homepage = "https://github.com/hediwen831-star/attack-surface"
Repository = "https://github.com/hediwen831-star/attack-surface"
Issues = "https://github.com/hediwen831-star/attack-surface/issues"
Changelog = "https://github.com/hediwen831-star/attack-surface/blob/main/CHANGELOG.md"

[tool.setuptools]
# 显式列出所有包。pocs / rules / api/static 里只有数据文件、没有 Python 代码，
# 但同样要声明成包 —— 否则 setuptools 打包时会对这三个目录各报一条
# "Package '...' is absent from the `packages` configuration" 警告。
packages = [
  "asp",
  "asp.core",
  "asp.discover",
  "asp.plugins",
  "asp.services",
  "asp.api",
  "asp.api.static",
  "asp.pocs",
  "asp.rules",
]

# 数据文件按所属包声明。`**/` 一并覆盖，便于今后在子目录里追加规则。
[tool.setuptools.package-data]
"asp.pocs" = ["*.yaml", "**/*.yaml"]
"asp.rules" = ["*.yaml", "**/*.yaml"]
"asp.api.static" = ["*.html"]

# ---------------------------------------------------------------- 工具配置

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",   # 行长由 formatter 兜底，注释里的长说明不该被打断
  "B008",   # 允许函数默认值里调用函数（dataclass field 需要）
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]   # 测试里允许 assert False 之类的写法

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
